[project]
name = "clustering-listwise-dpo"
version = "0.1.0"
description = "DPO vs listwise LIPO-λ preference optimization on Mistral-7B / GSM8K"
requires-python = ">=3.12"
dependencies = [
    # vllm pins its own torch + transformers; everything else rides on top.
    "vllm>=0.27",
    "trl>=0.24",
    "peft>=0.17",
    "accelerate>=1.10",
    "datasets>=4.0",
    "wandb>=0.21",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "math-verify>=0.7",   # sympy-based correctness oracle (utils.is_correct, eval answers_match)
    "matplotlib>=3.8",    # graphs/plot_arms.py
]

[tool.uv]
# Script repo, not an installable package — uv sync only manages dependencies.
package = false
