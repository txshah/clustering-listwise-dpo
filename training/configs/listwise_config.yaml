model_name_or_path: mistralai/Mistral-7B-v0.1   # swap for your SFT checkpoint
dataset_path:       generation/traces/listwise_pairs.jsonl
output_dir:         outputs/listwise_mistral7b

# LIPO-λ hyperparameters
beta:    0.1
lambdas: [1.0, 0.75, 0.5, 0.25]   # λ per cascade level (top rank weighted most)
logp_agg: sum   # sum = DPO/LPOI convention; mean pins the loss at init (β·Δlogp too small)

learning_rate:               1.0e-5   # Tier 0 winner (maj@8 0.486 vs 0.480 @3e-6, 0.448 @3e-5; 3e-6 flatlined)
per_device_train_batch_size: 1     # 5 sequences per item — lower batch size needed
gradient_accumulation_steps: 16
num_train_epochs:            3
max_length:                  1024
eval_split:                  0.05
logging_steps:               1
seed:                        42

# W&B (override on the CLI with --wandb_project / --wandb_group / --no_wandb)
wandb_project: clustering-listwise-dpo
wandb_group:   listwise
