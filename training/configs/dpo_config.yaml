model_name_or_path: mistralai/Mistral-7B-v0.1   # swap for your SFT checkpoint
dataset_path:       generation/traces/dpo_pairs.jsonl
output_dir:         outputs/dpo_mistral7b

beta:                        0.1
learning_rate:               3.0e-5
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
num_train_epochs:            3
max_length:                  1024   # prompt + completion cap (TRL 1.x has no separate prompt cap)
eval_split:                  0.05
logging_steps:               1
seed:                        42

# W&B (override on the CLI with --wandb_project / --wandb_group / --no_wandb)
wandb_project: clustering-listwise-dpo
wandb_group:   dpo
